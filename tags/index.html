                    opacity: 1;
                }</style></noscript><div id="matrix-loader"><canvas id="matrix-canvas"></canvas></div><a href="#" class="back-to-top-btn">▲ UP</a><script>(function() {
    window.addEventListener('DOMContentLoaded', () => {
        
        // === MATRIX Effect ===
        const canvas = document.getElementById('matrix-canvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            const fontSize = 16;
            const columns = Math.floor(canvas.width / fontSize) + 1;
            const rainDrops = Array(columns).fill(1);
            
            function drawMatrix() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#0F0';
                ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < rainDrops.length; i++) {
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                    if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        rainDrops[i] = 0;
                    }
                    rainDrops[i]++;
                }
            }

            let matrixInterval = setInterval(drawMatrix, 30);
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });

            setTimeout(() => {
                clearInterval(matrixInterval);
                document.body.classList.add('site-loaded');
                const targets = document.querySelectorAll('.matrix-decode');
                targets.forEach(el => scrambleText(el));
            }, 2000);
        }

        function scrambleText(element) {
            if (!element) return;
            const finalText = element.innerText; 
            const randomChars = "$%&*()_+[]{}?";
            let count = 0;
            let textInterval = setInterval(() => {
                element.innerText = finalText.split("").map((char, index) => {
                    if (index < count) return finalText[index];
                    return randomChars[Math.floor(Math.random() * randomChars.length)];
                }).join("");
                if (count >= finalText.length) {
                    clearInterval(textInterval);
                    element.classList.add('decoded');
                }
                count += 1;
            }, 40);
        }

        // === (MOUSE & TOUCH) ===
        let lastMove = 0;

        function createBinaryParticle(x, y) {
            const now = Date.now();
            if (now - lastMove < 40) return; 
            lastMove = now;

            const particle = document.createElement('span');
            particle.className = 'matrix-mouse-particle';
            particle.innerText = Math.random() > 0.5 ? '1' : '0';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            
            document.body.appendChild(particle);

            setTimeout(() => {
                const randomX = (Math.random() - 0.5) * 20;
                const randomY = Math.random() * 50 + 20; 
                particle.style.transform = `translate(${randomX}px, ${randomY}px)`;
                particle.style.opacity = '0';
            }, 50);

            setTimeout(() => {
                particle.remove();
            }, 850);
        }

        //  MOUSE PC
        window.addEventListener('mousemove', (e) => {
            createBinaryParticle(e.clientX, e.clientY);
        });

        // Slide Phone
        window.addEventListener('touchmove', (e) => {
            if (e.touches && e.touches.length > 0) {
                createBinaryParticle(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        // === ARĂTARE/ASCUNDERE BUTON LA SCROLL ===
        window.addEventListener('scroll', () => {
            const topBtn = document.querySelector('.back-to-top-btn');
            if (topBtn) {
                if (window.scrollY > 300) {
                    topBtn.classList.add('show');
                } else {
                    topBtn.classList.remove('show');
                }
            }
        });
        
    });
})();</script></head><body class="tags-template"><div class="container container--center"><header class="header"><div class="header__logo"><a class="logo" href="https://citaru.github.io/">citaru</a></div><nav class="navbar js-navbar"><button class="navbar__toggle js-toggle" aria-label="Menu" aria-haspopup="true" aria-expanded="false"><span class="navbar__toggle-box"><span class="navbar__toggle-inner">Menu</span></span></button><ul class="navbar__menu"><li class="meniu-stilizat"><a href="#" target="_self">Acasă</a></li><li class="meniu-stilizat"><a href="#sectiune-preturi" target="_self">Prețuri</a></li></ul></nav></header><main class="content page page--tags"><div class="content page"><div class="page__header"><h1 class="h2 page__title">Collection of all tags</h1></div><ul class="list"></ul></div></main><footer class="footer"><div class="footer__inner"><div class="footer__copyright"><p>© 2026 Powered by citaru</p></div></div></footer></div><script defer="defer" src="https://citaru.github.io/assets/js/scripts.min.js?v&#x3D;c2232aa7558e9517946129d2a1b8c770"></script><script>window.publiiThemeMenuConfig={mobileMenuMode:'sidebar',animationSpeed:300,submenuWidth: 'auto',doubleClickTime:500,mobileMenuExpandableSubmenus:true,relatedContainerForOverlayMenuSelector:'.top'};</script><script>var images = document.querySelectorAll('img[loading]');
